{n:17,g:'Momentum & impuls',t:'Cari besar impuls pada bola.',q:'Bola bermassa 20 gram dilempar dengan kecepatan v₁ = 4 m/s ke kiri. Setelah membentur tembok, bola memantul dengan kecepatan v₂ = 2 m/s ke kanan. Besar impuls yang dihasilkan adalah ....',o:['0,12 N·s','0,06 N·s','0,04 N·s','0,24 N·s','0,08 N·s'],a:0,
p:[['Massa bola',20,10,50,5,'g'],['Kecepatan datang v₁',4,1,8,1,'m/s'],['Kecepatan pantul v₂',2,1,8,1,'m/s']],
s:p=>{let[m,a,b]=p;return[`Arah kanan positif: v₁ = −${a} m/s (ke kiri), v₂ = +${b} m/s, m = ${m} g = ${m/1000} kg`,`I = Δp = m(v₂ − v₁) = ${m/1000} × (${b} − (−${a}))`,`I = ${f(m/1000*(a+b))} N·s. Arah bola berbalik, jadi perubahan kecepatannya ${a+b} m/s, bukan ${a-b} m/s (itu kunci sumber yang keliru).`]},

];

const GURU={"2": {"inti": "Pecah tiga langkah jalan kaki menjadi “ke timur” dan “ke utara”, jumlahkan tiap arah, lalu gabungkan dengan Pythagoras.", "analogi": "Bayangkan siswa Anda berjalan di lapangan sekolah: 100 langkah ke timur, 40 langkah ke utara, lalu serong. Pedometer di HP mencatat <b>jarak</b> = 240 m (total langkah). Tetapi kalau ada burung terbang lurus dari titik awal ke titik akhir, jarak terbangnya itulah <b>perpindahan</b>, yaitu 200 m. Burung selalu lebih hemat daripada pejalan kaki.", "alur": [["Uraikan vektor ketiga (100 m)", "Garis ketiga membentuk 37° terhadap <b>utara</b>, sama artinya dengan 53° terhadap timur (37° + 53° = 90°). Aturan menguraikan yang mudah diingat: komponen pada sumbu yang <b>menempel</b> pada sudut = panjang × cos; komponen pada sumbu yang <b>berhadapan</b> dengan sudut = panjang × sin. timur<br>= 100 × sin 37° = 100 × 0,6 = 60 m utara<br>= 100 × cos 37° = 100 × 0,8 = 80 m Dari mana cos 37° = 0,8? Dari sin²37° + cos²37° = 1, sehingga cos 37° = √(1 − 0,36) = 0,8. (Nilai cos 53° = 0,6 pada soal sama dengan sin 37°, sebab sudut yang saling berpenyiku nilai sin dan cos-nya tertukar.)"], ["Jumlahkan komponen sejenis", "Rx = 100 + 0 + 60 = 160 m Ry = 0 + 40 + 80 = 120 m <i>Diagram penjumlahan: tiga vektor disusun ujung ke pangkal, hasilnya R = 200 m.</i>"], ["Gabungkan dengan Pythagoras", "R = √(160² + 120²) = √(25.600 + 14.400) = √40.000 = <b>200 m</b>"]], "cek": "", "pintas": "Perhatikan rasio komponen: 160 : 120 = <b>4 : 3</b>. Segitiga dengan sisi tegak 3 : 4 selalu bersisi miring 5, jadi R = 5 × 40 = 200 m. Biasakan siswa mengenali tripel Pythagoras (3-4-5, 5-12-13, 8-15-17) sebelum mengetik kalkulator.", "jebakan": "<b>Jarak ≠ perpindahan.</b> Menjumlahkan panjang langkah (100 + 40 + 100) menghasilkan 240 m, yaitu pilihan B yang sengaja dipasang sebagai jebakan. <b>Sin dan cos tertukar.</b> Jika kedua komponen tertukar (80 m dan 60 m) hasilnya 205,9 m; jika hanya komponen tegak yang salah (60 m) hasilnya 188,7 m. Keduanya tidak ada di pilihan, dan itu alarm bagi siswa untuk mengecek ulang. <b>Sudut diukur dari mana?</b> Kalimat “37° ke arah timur” memang ambigu. Konteks soal (diberi cos 53° = 0,6) menunjukkan sudutnya 37° dari utara menuju timur. Latih siswa bertanya: “sudut ini diukur dari sumbu yang mana?”", "ruang": "<b>Pertanyaan pemantik</b> “Kalau jalan 3 langkah ke timur lalu 4 langkah ke utara, berapa langkah jalan pintas lurusnya?” (5) “Mengapa total langkah (240) tidak sama dengan perpindahan (200)?” <b>Aktivitas / demo kelas</b> Gunakan lantai berpetak atau ubin: dua siswa berjalan mengikuti rute, satu siswa berperan sebagai “burung” yang berjalan lurus. Hitung ubinnya bersama-sama. <b>Tips mengajar</b> Tutup dengan satu kalimat yang bisa dihafal: “Vektor tidak bisa dijumlah langsung. <b>Pecah, jumlah, gabung.</b>”"}, "3": {"inti": "Ubah cerita tiga tahap perjalanan mobil menjadi tiga titik emas pada grafik: (20 s; 20 m/s), (30 s; 50 m/s), dan (40 s; 0).", "analogi": "Grafik v–t itu seperti <b>rekaman speedometer</b>. Tinggi grafik = angka yang ditunjuk jarum speedometer. Kemiringan garis = seberapa dalam pedal gas atau rem diinjak (makin miring, makin kuat). Luas di bawah grafik = angka di odometer, yaitu jarak yang sudah ditempuh. <i>Tiga “bahasa” grafik v–t: tinggi, kemiringan, dan luas.</i>", "alur": [["Samakan satuan lebih dulu", "72 km/jam = 72 × 1000 m ÷ 3600 s = 72 ÷ 3,6 = <b>20 m/s</b> Tips untuk siswa: dari km/jam ke m/s cukup <b>dibagi 3,6</b>."], ["Cari titik emas tiap tahap", "<b>Tahap</b> <b>Perhitungan</b> <b>Titik pada grafik</b> 1. GLB v tetap 20 m/s selama 20 s (0 ; 20) → (20 ; 20) 2. Dipercepat v = v0 + a·t = 20 + 3×10 = 50 m/s (20 ; 20) → (30 ; 50) 3. Diperlambat 0 = 50 − 5·t′ → t′ = 10 s, jadi berhenti di t = 30 + 10 (30 ; 50) → (40 ; 0) <i>Grafik yang benar: datar, naik landai (3 m/s tiap sekon), lalu turun lebih curam (5 m/s tiap sekon).</i>"], ["Cocokkan dengan pilihan jawaban", "Grafik yang benar harus melewati ketiga titik emas. <b>A</b> baru berhenti di t = 50 s (perlambatannya hanya 2,5 m/s²). <b>D</b> turun sampai nol lalu naik lagi. <b>E</b> punya puncak 35 m/s pada t = 25 s dan berhenti di t = 30 s. <b>B</b> tidak menandai t = 30 s pada sumbu waktu dan memuat angka 30 pada sumbu kecepatan yang tidak ada dalam data. Hanya <b>C</b> yang cocok."]], "cek": "Luas di bawah grafik = jarak: 20 × 20 + ½(20 + 50) × 10 + ½ × 50 × 10 = 400 + 350 + 250 = <b>1000 m</b>. Hasil ini sama dengan perhitungan lewat rumus gerak lurus tiap tahap.", "pintas": "Cukup hitung dua hal: <b>puncak</b> (50 m/s) dan <b>waktu berhenti</b> (40 s). Pilihan yang puncaknya bukan 50 m/s atau berhenti tidak di 40 s langsung gugur. Eliminasi seperti ini bisa selesai dalam 30 detik.", "jebakan": "<b>Lupa konversi satuan:</b> 72 dibaca sebagai 72 m/s, sehingga seluruh grafik bergeser. <b>Durasi dikira titik waktu.</b> “10 sekon” pada tahap 3 adalah lama tahapnya, bukan t = 10 s. Titiknya ada di t = 30 + 10 = 40 s. <b>Grafik dikira bentuk jalan.</b> Sebagian siswa membaca garis naik sebagai mobil mendaki. Ingatkan: sumbu tegak adalah kecepatan, bukan ketinggian.", "ruang": "<b>Pertanyaan pemantik</b> “Kalau rem lebih lemah (perlambatan 2,5 m/s²), garis turunnya jadi lebih curam atau lebih landai? Mobil berhenti di detik berapa?” (landai; t = 50 s, itulah pilihan A) <b>Aktivitas / demo kelas</b> <b>Walk the Graph:</b> minta siswa berjalan di depan kelas mengikuti “perintah grafik”: cepat tetap, makin cepat, lalu makin pelan sampai berhenti. Satu siswa lain menggambar grafiknya di papan. Sebelum membuka pilihan, beri siswa 1 menit menggambar sketsa sendiri di papan kecil, lalu cocokkan."}, "4": {"inti": "Dua bola dilempar berselisih 2 s: tulis tinggi keduanya dengan satu “jam acuan” (waktu bola A), lalu samakan.", "analogi": "Dua mobil berangkat dari terminal yang sama, tetapi mobil B berangkat 2 jam setelah mobil A. Mereka “bertemu” bila posisinya sama pada <b>jam yang sama</b>. Bedanya, lintasan bola naik-turun: saat berpapasan, satu bola sedang turun dan yang lain sedang naik, persis dua orang yang berpapasan di tangga.", "alur": [["Satu jam acuan untuk kedua bola", "Ambil t = waktu sejak bola A dilempar. Bola B baru dilempar 2 s kemudian, sehingga waktu geraknya (t − 2). Dengan ½g = 5: yA = 20t − 5t² yB = 20(t − 2) − 5(t − 2)²"], ["Syarat bertemu: y<b>**A</b>", "= y<b>**B</b> 20t − 5t² = 20t − 40 − 5(t² − 4t + 4) 20t − 5t² = 40t − 5t² − 60 Suku −5t² ada di kedua ruas sehingga saling meniadakan: 20t = 60, jadi <b>t = 3 s</b>."], ["Hitung tinggi saat bertemu", "y = 20(3) − 5(3)² = 60 − 45 = <b>15 m</b> Cek dengan bola B (waktu geraknya 3 − 2 = 1 s): yB = 20(1) − 5(1)² = 15 m. Sama, jadi benar. Saat itu vA = 20 − 10×3 = −10 m/s (sedang turun) dan vB = 20 − 10×1 = +10 m/s (sedang naik). <i>Grafik y–t: dua parabola yang sama bentuk, B digeser 2 s. Titik potongnya adalah pertemuan.</i>"]], "cek": "", "pintas": "<b>Jalan pintas simetri.</b> Saat berpapasan, tinggi kedua bola sama, sehingga lajunya sama (kekekalan energi) tetapi arahnya berlawanan: vA = −vB. 20 − 10t = −[20 − 10(t − 2)]<br>→<br>t = 3 s Rumus umum untuk dua bola dengan kecepatan awal sama: <b>t = v</b><b>0</b><b>/g + Δt/2</b> = 2 + 1 = 3 s.", "jebakan": "<b>Menjawab 20 m</b> karena melihat “tinggi maksimum” (itu kunci sumber yang keliru). <b>Memakai t yang sama untuk A dan B</b>, lupa bahwa B baru bergerak selama (t − 2). <b>Mengira mereka bertemu saat A di puncak.</b> Pada t = 2 s bola B masih di tanah.", "ruang": "<b>Pertanyaan pemantik</b> “Pada t = 2 s, di mana bola A dan di mana bola B? Mungkinkah mereka bertemu di 20 m?” “Mengapa suku t² saling meniadakan?” (karena kedua parabola sama bentuk, jadi persamaannya menjadi linear dan hanya ada satu titik potong) <b>Aktivitas / demo kelas</b> Gambar grafik y–t di papan: satu parabola, lalu salin dan geser 2 s ke kanan. Titik potongnya langsung terlihat dan siswa melihat bahwa pertemuan terjadi di sisi turun A dan sisi naik B."}, "24": {"inti": "Tulis posisi titik yang ditanya memakai sudut φ, turunkan terhadap waktu, lalu gabungkan komponen mendatar dan tegak.", "analogi": "Pernah melihat <b>pagar lipat (harmonika)</b> atau gunting engsel penggantung baju? Ketika ujungnya ditarik, semua sambungan ikut bergerak. Yang paling jauh dari dinding bergerak paling cepat, yang menempel di dinding diam. Struktur ini tidak lain adalah pagar lipat tiga ruas.", "alur": [["Model geometri", "Misalkan sisi belah ketupat terkecil l, sehingga sisi ketiga belah ketupat adalah 3l, 2l, dan l. Belah ketupat bersisi s memiliki diagonal mendatar <b>2s cos φ</b> dan diagonal tegak <b>2s sin φ</b>. <i>Struktur engsel dan besaran-besaran yang dipakai.</i>"], ["Tulis posisi titik-titik penting", "xA3 = 2(3l)cos φ + 2(2l)cos φ + 2(l)cos φ = 12 l cos φ xB2 = 6 l cos φ + 2 l cos φ = 8 l cos φ<br>yB2 = 2 l sin φ Perhatikan xB2 = (8/12) xA3 = (2/3) xA3. Maka kecepatan mendatar B2 selalu <b>2/3 dari v</b>, tanpa kalkulus sekalipun. Tabel di bawah menunjukkan pola “makin jauh dari dinding, makin cepat”. <b>Titik</b> <b>Posisi mendatar</b> <b>Kecepatan mendatar</b> A0 0 (menempel di dinding) 0 B1 3l cos φ 1/4 v A1 6l cos φ 1/2 v B2 8l cos φ <b>2/3 v</b> A2 10l cos φ 5/6 v B3 11l cos φ 11/12 v A3 12l cos φ v"], ["Turunkan terhadap waktu", "Kecepatan A3 diketahui: v = dxA3/dt. Sudut φ ikut berubah: v = d(12 l cos φ)/dt = −12 l sin φ · (dφ/dt)<br>→<br>dφ/dt = −v / (12 l sin φ) vB2x = d(8 l cos φ)/dt = −8 l sin φ · (dφ/dt) = (2/3) v vB2y = d(2 l sin φ)/dt = 2 l cos φ · (dφ/dt) = −(v/6) cot φ"], ["Masukkan sudut struktur 90°", "“Sudut struktur 90°” berarti sudut di sambungan A0 adalah 90°, yaitu 2φ = 90°, sehingga <b>φ = 45°</b> dan cot 45° = 1: vB2x = (2/3) v<br>vB2y = −v/6<br>(tanda minus: B2 bergerak turun)"], ["Kelajuan B****2", "vB2 = √[(2v/3)² + (v/6)²] = v √(16/36 + 1/36) = v √(17/36) = <b>(1/6) v √17</b>"]], "cek": "vB2 = (√17/6) v ≈ 0,69 v, lebih kecil daripada v. Masuk akal, sebab B2 lebih dekat ke dinding daripada A3 (komponen mendatarnya hanya 2/3 v) dan bergerak sedikit turun.", "pintas": "Pisahkan pekerjaan: <b>komponen mendatar</b> didapat dari rasio posisi (tanpa turunan), <b>komponen tegak</b> baru memakai turunan. Cara ini memotong separuh pekerjaan siswa.", "jebakan": "<b>Mengira φ adalah sudut struktur.</b> Sudut struktur 90° = 2φ, jadi φ = 45°, bukan 90°. <b>Hanya memakai komponen mendatar</b> (2v/3), padahal B2 juga bergerak turun sehingga harus digabung dengan komponen tegak. <b>Takut pada tanda minus.</b> Kecepatan tegak negatif karena B2 turun, namun kelajuan memakai kuadrat sehingga tandanya tidak memengaruhi hasil akhir.", "ruang": "<b>Pertanyaan pemantik</b> “Mana yang bergerak lebih cepat: B1 atau B2?” (B2, sekitar 0,69 v dibanding 0,35 v untuk B1) “Kalau struktur makin memanjang (φ mengecil), B2 naik atau turun?” (turun, mendekati sumbu mendatar) <b>Aktivitas / demo kelas</b> Buat model gunting engsel dari 6 batang stik es krim atau penggaris plastik yang dihubungkan paku payung/baut kecil. Minta siswa menarik ujungnya dan menandai titik-titik yang bergerak cepat dan lambat. <b>Tips mengajar</b> Jika siswa belum belajar turunan, cukup tunjukkan jalur rasio untuk komponen mendatar lalu berikan nilai vB2y = −v/6 sebagai “hasil yang bisa dibuktikan nanti”."}, "6": {"inti": "Yang ditanya hanya waktu ke titik tertinggi, jadi cukup pakai sumbu vertikal: kecepatan vertikal menjadi nol.", "analogi": "Bayangkan lampu menyorot bola yang terbang. <b>Bayangan di lantai</b> bergerak dengan laju tetap (GLB), sedangkan <b>bayangan di dinding</b> naik lalu turun seperti bola yang dilempar lurus ke atas. Dua bayangan itu tidak saling mengganggu. Itulah inti gerak parabola: dua gerak yang berdiri sendiri-sendiri.", "alur": [["Uraikan kecepatan awal", "v0y = v0 sin α = 20 × sin 60° = 20 × ½√3 = 10√3 m/s v0x = v0 cos α = 20 × ½ = 10 m/s"], ["Syarat titik tertinggi: v<b>**y</b>", "= 0<b> vy = v0y − g·t<br>→<br>0 = 10√3 − 10t<br>→<br></b>t = √3 s ≈ 1,73 s** Rumus umumnya t = v0 sin α / g. Tinggi maksimum: (v0 sin α)²/2g = 300/20 = 15 m, dan waktu naik 1,73 s masuk akal untuk bola yang naik 15 m dengan kecepatan awal vertikal 17,3 m/s."], ["Gambaran lengkap lintasan", "<i>Lintasan peluru: naik √3 s, total di udara 2√3 s, jangkauan sekitar 34,6 m.</i>"]], "cek": "", "pintas": "Hafalkan nilai istimewa: sin 30° = ½, sin 45° = ½√2, sin 60° = ½√3. Lalu <b>t</b><b>puncak</b><b> = v</b><b>0</b><b> sin α / g</b> langsung dipakai tanpa menurunkan lagi.", "jebakan": "<b>Pilihan A (1 s):</b> siswa memakai cos 60° = 0,5 sehingga v0y = 10 m/s dan t = 1 s. <b>Pilihan B (2 s):</b> siswa lupa menguraikan kecepatan dan memakai t = v0/g = 20/10. <b>Pilihan D (2√3 s):</b> itu waktu <b>total</b> sampai peluru mendarat (naik + turun), bukan waktu ke puncak. <b>“Di puncak peluru berhenti.”</b> Keliru: hanya vy = 0. Kecepatan mendatar tetap 10 m/s, sehingga laju di puncak = 10 m/s.", "ruang": "<b>Pertanyaan pemantik</b> “Di titik tertinggi, berapa kelajuan peluru?” (10 m/s, bukan nol) “Sudut 30° dan 60° sama-sama memberi jangkauan yang sama. Mengapa?” (R sebanding dengan sin 2α, dan sin 60° = sin 120°) <b>Aktivitas / demo kelas</b> <b>Demo koin:</b> sentil satu koin mendatar dari tepi meja dan jatuhkan koin lain bersamaan. Keduanya menyentuh lantai pada saat yang sama, bukti bahwa gerak tegak tidak terpengaruh gerak mendatar."}, "5": {"inti": "Dua roda sepusat berputar bersama, jadi ω-nya sama. Makin ke tepi, makin cepat.", "analogi": "Barisan murid bergandengan tangan berputar mengelilingi tiang bendera. Murid yang paling ujung harus <b>berlari paling kencang</b>, padahal semuanya menyelesaikan satu putaran pada saat yang sama. Itulah roda sepusat: ω sama, tetapi laju linear makin besar ke arah tepi.", "alur": [["Kenali jenis hubungan roda", "Pada gambar, kedua lingkaran memiliki satu titik pusat yang sama (<b>sepusat</b>), jadi ωA = ωB."], ["Tulis perbandingan", "vA/RA = vB/RB vB = vA × RB/RA = 4 × 8/5 = 32/5 = <b>6,4 m/s</b> Jari-jari boleh tetap dalam cm karena yang dipakai adalah perbandingannya."], ["Cek lewat ω", "ωA = vA/RA = 4/0,05 = 80 rad/s dan ωB = 6,4/0,08 = 80 rad/s. Kedua ω sama, jadi hitungan konsisten. Tepi roda yang jari-jarinya lebih besar memang harus bergerak lebih cepat (6,4 m/s &gt; 4 m/s)."]], "cek": "", "pintas": "Mnemonik untuk siswa: <b>“Satu poros, sama ω. Satu sabuk, sama v.”</b> Sepusat: v sebanding dengan R. Sabuk atau bersinggungan: ω berbanding terbalik dengan R.", "jebakan": "<b>Memakai v sama</b> (menjawab 4 m/s) karena merasa “rodanya terhubung”. Itu berlaku untuk sabuk, bukan roda sepusat. <b>Perbandingan terbalik:</b> vB = 4 × 5/8 = 2,5 m/s. Hasil ini tidak ada di pilihan, tetapi sering muncul pada siswa yang menukar RA dan RB. <b>Salah membaca gambar</b> sehingga dua roda sepusat dianggap saling bersinggungan.", "ruang": "<b>Pertanyaan pemantik</b> “Jarum menit jam dinding: ujung dan pangkalnya sama-sama menyelesaikan satu putaran dalam 60 menit. Titik mana yang lajunya lebih besar?” <b>Aktivitas / demo kelas</b> Tempel dua stiker pada keping CD, satu dekat pusat dan satu di tepi. Putar perlahan dan minta siswa memperkirakan mana yang “selesai satu putaran” lebih dulu dan mana yang lajunya lebih besar."}, "8": {"inti": "Gesekan ban adalah “tali” yang menarik mobil ke pusat tikungan, dan kekuatan “tali” itu terbatas sebesar μ·m·g.", "analogi": "Putar sebuah bola yang diikat tali. Tali menarik bola ke pusat. Di tikungan jalan datar, “tali”-nya adalah <b>gesekan ban</b>. Jika gesekan tidak cukup kuat, “tali” putus dan mobil lepas <b>lurus</b> mengikuti arah geraknya, bukan “terlempar keluar” oleh gaya misterius.", "alur": [["Syarat tidak tergelincir", "Gaya sentripetal yang dibutuhkan tidak boleh melebihi gesekan maksimum: m v²/r ≤ μ m g<br>→<br>v ≤ √(μ g r) Massa mobil m dicoret di kedua ruas, jadi kecepatan maksimum <b>tidak bergantung pada massa</b>. Kecepatan maksimum didapat saat tanda ≤ menjadi =."], ["Substitusi angka", "Dengan μ = 0,5, g = 10 m/s², dan r = 40 m (jari-jari lintasan di posisi M menurut pembahasan sumber): vmaks = √(0,5 × 10 × 40) = √200 = √(100 × 2) = <b>10√2 m/s</b>"], ["Beri “rasa” pada angkanya", "10√2 ≈ 14,1 m/s ≈ <b>51 km/jam</b>. Angka seperti ini membantu siswa merasakan bahwa tikungan kecil di jalan kampung memang tidak boleh dilalui sekencang jalan tol."]], "cek": "", "pintas": "Ingat bentuk <b>v = √(μ g r)</b> sebagai “μgr di bawah akar”. Tiga akibat yang bisa ditebak tanpa menghitung: jalan basah (μ turun) → vmaks turun; tikungan lebih tajam (r turun) → vmaks turun; massa mobil tidak berpengaruh. Karena v ∝ √r, tikungan yang 4 kali lebih tajam hanya boleh dilalui dengan <b>setengah</b> kecepatan.", "jebakan": "<b>“Gaya sentrifugal melempar mobil keluar.”</b> Dalam kerangka tanah tidak ada gaya semacam itu. Mobil ingin lurus (inersia), dan gesekan yang membelokkannya. <b>Mengira massa memengaruhi hasil.</b> Truk dan motor memiliki vmaks sama jika μ dan r sama. <b>Lupa tanda akar</b> sehingga menjawab v² = 200 m²/s² sebagai kecepatan, atau memakai r = 30 m dari gambar tanpa membaca catatan di atas.", "ruang": "<b>Pertanyaan pemantik</b> “Mengapa rambu ‘kurangi kecepatan’ di tikungan paling penting saat hujan?” (μ turun, vmaks turun) “Mengapa penumpang terasa terdorong ke luar?” (penumpang ingin lurus, sedangkan mobil berbelok) <b>Aktivitas / demo kelas</b> <b>Koin di piringan putar:</b> letakkan dua koin di atas piringan (atau tutup toples di atas CD yang diputar pelan di pemutar piringan). Koin yang di tepi terlempar duluan, sedangkan koin dekat pusat bertahan, tanda bahwa syarat μg ≥ ω²r lebih sulit dipenuhi di r besar."}, "16": {"inti": "Tiap pantulan mengalikan tinggi dengan e² yang tetap. Dari 8 m → 4 m, maka pantulan berikutnya 4 m → 2 m.", "analogi": "Seperti tabungan yang tiap kali diambil separuhnya: 8 → 4 → 2 → 1. Faktor pengalinya tetap karena sifat bola dan lantai tidak berubah. Bola yang bagus (e besar) kehilangan sedikit; bola plastisin (e = 0) kehilangan semuanya.", "alur": [["Cari e dari pantulan pertama", "e = √(4/8) = √(1/2) = 1/√2 ≈ 0,71"], ["Terapkan pada pantulan kedua", "Bola kini jatuh dari 4 m (tinggi pantulan pertama) dan memantul sampai h2: e = √(h2/4)<br>→<br>e² = h2/4<br>→<br>h2 = e² × 4 = ½ × 4 = <b>2 m</b>"], ["Lihat polanya", "<i>Tinggi berturut-turut 8 → 4 → 2 → 1 m: deret geometri dengan rasio e².</i>"]], "cek": "", "pintas": "Setiap pantulan: <b>tinggi baru = tinggi lama × e²</b>, dan e² = h′/h dari pantulan pertama. Dengan begitu 8 → 4 → 2 → 1. Massa bola 100 gram hanyalah data pengecoh karena m dicoret dalam kekekalan energi.", "jebakan": "<b>Tinggi dikali e, bukan e².</b> Dengan e = 0,71 siswa mendapat 0,71 × 4 = 2,83 m, yang tidak ada di pilihan, sehingga ketahuan salah. <b>Menyamakan e dengan h′/h = ½.</b> Di soal ini jawabannya kebetulan tetap 2 m (4 × ½), sehingga kesalahan konsep lolos begitu saja. Pancing dengan pertanyaan: “berapa e-nya?” Jawaban yang benar 0,71, bukan 0,5. <b>Menebak “tinggal dibagi 2”</b> tanpa alasan. Cara itu gagal bila rasionya tidak sederhana, misalnya 8 → 5 → ? (jawaban 5 × 5/8 = 3,125 m). <b>Terpengaruh massa 100 g</b> sehingga mencoba menghitung energi atau gaya.", "ruang": "<b>Pertanyaan pemantik</b> “Berapa persen energi yang hilang pada setiap pantulan?” (e² = 50%, jadi separuh) “Bila e = 1, ke mana tinggi pantulan? Bila e = 0?” (tetap sama; tidak memantul sama sekali) <b>Aktivitas / demo kelas</b> <b>Ukur e sendiri:</b> jatuhkan bola pingpong dari 1 m di samping penggaris tegak, rekam dengan kamera HP (mode slow-mo), dan baca tinggi pantulan pertama dan kedua. Hitung e dari dua pantulan dan lihat apakah hasilnya konsisten."}, "17": {"inti": "Bola berbalik arah: perubahan kecepatan dari −4 menjadi +2 adalah 6 m/s, bukan 2 m/s.", "analogi": "Saat memukul bola kasti, pemukul mengerjakan <b>dua pekerjaan</b>: pertama menghentikan bola yang datang, kedua melontarkannya kembali. Impuls adalah jumlah kedua pekerjaan itu. Untuk bola ini: menghentikan (0,02 × 4 = 0,08) ditambah melontarkan kembali (0,02 × 2 = 0,04) = <b>0,12 N·s</b>.", "alur": [["Tetapkan arah positif dan satuan", "Ambil arah ke kanan positif. Massa 20 g = 0,02 kg. Bola datang ke kiri sehingga v1 = −4 m/s, dan memantul ke kanan sehingga v2 = +2 m/s."], ["Hitung impuls", "I = m (v2 − v1) = 0,02 × (2 − (−4)) = 0,02 × 6 = <b>0,12 N·s</b> Tanda positif berarti impuls berarah ke kanan, yaitu dari tembok ke bola, sebab dinding mendorong bola ke kanan."]], "cek": "", "pintas": "Kalau bola <b>berbalik arah</b>: I = m (│v1│ + │v2│). Kalau arahnya <b>sama</b> (hanya melambat): I = m (│v1│ − │v2│). Pertanyaan penentunya: “apakah bola berbalik?”", "jebakan": "<b>Mengurangkan besar kecepatan</b> (4 − 2 = 2) sehingga mendapat 0,04 N·s. Itu kunci sumber yang keliru. <b>Gram tidak diubah ke kilogram:</b> 20 × 6 = 120, jauh dari semua pilihan. <b>Menyamakan impuls dengan gaya.</b> Satuan impuls N·s, bukan N. Gaya rata-rata baru didapat setelah dibagi waktu sentuh.", "ruang": "<b>Pertanyaan pemantik</b> “Berapa langkah dari −4 ke +2 di garis bilangan?” (6, tulis di papan sebelum menghitung apa pun) “Mana yang lebih besar impulsnya: bola yang memantul atau bola plastisin yang menempel di tembok?” (yang memantul, karena arahnya berbalik) <b>Aktivitas / demo kelas</b> Lempar bola tenis dan bola plastisin (massa sama, kecepatan sama) ke papan tulis kecil yang digantung. Papan lebih bergoyang saat dikenai bola yang memantul, bukti impulsnya lebih besar. <b>Tips mengajar</b> <b>Perluasan:</b> bila waktu sentuh 0,01 s, gaya rata-rata = I/Δt = 0,12/0,01 = 12 N."}, "7": {"inti": "Terjemahkan hukum II Newton ke bahasa rotasi (Στ = Iα), lalu bukti jawabannya lewat uji satuan.", "analogi": "Membuka mur dengan kunci inggris: tangan terasa lebih ringan bila gagangnya makin panjang. Gaya yang diperlukan <b>berbanding terbalik</b> dengan panjang lengan. Itulah mengapa R ada di penyebut.", "alur": [["Torsi dari gaya tali", "Torsi τ = F·R·sin φ, dengan φ sudut antara gaya dan lengan (jari-jari). Tali melilit sisi luar katrol sehingga menyinggung lingkaran, artinya tegak lurus jari-jari (φ = 90°, sin 90° = 1): τ = F·R"], ["Terapkan Στ = Iα", "Gesekan diabaikan, jadi hanya gaya F yang memberi torsi: F·R = β·α<br>→<br><b>F = α·β / R = α·β·R</b><b>−1</b>"], ["Uji satuan (senjata rahasia)", "<b>Pilihan</b> <b>Satuan</b> <b>Lolos?</b> A. α·β·R kg·m³·s−2 tidak B. α·β²·R kg²·m⁵·s−2 tidak C. α/(β·R) s−2/(kg·m³) tidak <b>D. α·β/R</b> <b>kg·m·s</b><b>−2</b><b> = newton</b> <b>ya</b> E. R/(α·β) s²/(kg·m) tidak Dengan α dalam s−2, β dalam kg·m², dan R dalam m, hanya D yang berakhir pada satuan gaya."]], "cek": "", "pintas": "<b>Uji satuan</b> menyelesaikan soal ini dalam kurang dari 30 detik: hanya satu pilihan yang menghasilkan satuan newton. Teknik ini berguna untuk semua soal simbolik.", "jebakan": "<b>Menulis F = Iα</b> (menyamakan gaya dengan torsi) sehingga R hilang. <b>Mengira R mengalikan:</b> “lengan lebih panjang berarti gaya lebih besar.” Justru kebalikannya. <b>Salah membaca pangkat:</b> R−1 berarti 1/R, bukan −R.", "ruang": "<b>Pertanyaan pemantik</b> “Mengapa pegangan pintu dipasang jauh dari engselnya?” “Hanya satu pilihan yang lolos uji satuan. Cek satu per satu, mana yang lolos dan mengapa?” <b>Aktivitas / demo kelas</b> Tarik pintu dengan neraca pegas di dekat engsel dan di dekat gagang. Bandingkan bacaan neraca saat pintu mulai bergerak. <b>Tips mengajar</b> Jembatan ke Soal 9: torsi = gaya × lengan, dan lengan harus tegak lurus garis kerja gaya."}, "9": {"inti": "Tiap gaya punya lengan ke poros C. Hanya komponen tegak lurus batang yang memutar, dan arah putar diberi tanda + atau −.", "analogi": "Jadikan C sebagai tumpuan <b>jungkat-jungkit</b>. Gaya ke atas di sisi kiri tumpuan mengangkat ujung kiri, jadi papan berputar searah jarum jam. Ingat juga pintu: mendorong sejajar bidang pintu tidak akan membukanya. Itulah mengapa komponen gaya yang sejajar batang tidak menghasilkan torsi.", "alur": [["Petakan jarak dari poros C", "Jarak antartitik 1 m, sehingga AC = 2 m, CD = 1 m, CE = 2 m."], ["Hitung torsi tiap gaya", "<b>F</b><b>1</b><b> = 5 N</b>, tegak lurus batang, ke atas di A (2 m di kiri C). Gaya ke atas di kiri poros memutar searah jarum jam: τ1 = +5 × 2 = <b>+10 N·m</b>. <b>F</b><b>2</b><b> = 6 N</b> di D (1 m di kanan C), membentuk 30° dengan batang dan mengarah ke bawah-kiri. Komponen tegak lurus batang = 6 sin 30° = 3 N (ke bawah, di kanan poros, searah jarum jam): τ2 = +3 × 1 = <b>+3 N·m</b>. Komponen yang sejajar batang garis kerjanya melewati C sehingga lengannya nol dan torsinya nol. <b>F</b><b>3</b><b> = 6 N</b>, ke atas di E (2 m di kanan C). Gaya ke atas di kanan poros memutar berlawanan arah jarum jam: τ3 = −6 × 2 = <b>−12 N·m</b>."], ["Jumlahkan dengan tanda", "Στ = +10 + 3 − 12 = <b>+1 N·m</b> Tanda positif berarti resultan momen gaya terhadap C searah jarum jam dengan besar 1 N·m. <i>Diagram torsi: lengan, komponen tegak lurus, dan tanda tiap gaya.</i>"]], "cek": "", "pintas": "Beri tiga pertanyaan untuk setiap gaya: <b>(1)</b> berapa lengannya dari poros? <b>(2)</b> berapa komponen tegak lurusnya? <b>(3)</b> memutar ke arah mana? Jawaban ketiga pertanyaan langsung menjadi satu baris perhitungan.", "jebakan": "<b>Memakai 6 N penuh untuk F</b><b>2</b> (lupa sin 30°): 10 + 6 − 12 = 4 N·m, yaitu pilihan B. <b>Mengukur lengan dari A</b>, bukan dari poros C. <b>Lupa tanda arah putar</b> sehingga semua torsi dijumlahkan positif (10 + 3 + 12 = 25 N·m). Bila 6 N penuh ikut dipakai tanpa tanda, hasilnya 10 + 6 + 12 = 28 N·m, yaitu pilihan E.", "ruang": "<b>Pertanyaan pemantik</b> “Kalau F2 tegak lurus batang, torsinya berapa? Kapan torsi sebuah gaya maksimum?” (6 × 1 = 6 N·m; saat tegak lurus batang) <b>Aktivitas / demo kelas</b> Letakkan penggaris 30 cm bertumpu di penghapus. Taruh koin pada jarak berbeda di kiri dan kanan, lalu cari kombinasi yang membuat penggaris seimbang (Στ = 0). <b>Tips mengajar</b> <b>Pengayaan:</b> resultan gaya pada soal ini tidak nol (5 − 3 + 6 = 8 N ke atas), sehingga momen gayanya bergantung pada titik acuan. Bila poros dipindah ke A, Στ = 15 N·m berlawanan arah jarum jam. Hanya pada kesetimbangan (ΣF = 0) hasilnya sama untuk semua titik acuan."}, "10": {"inti": "Titik berat gabungan = rata-rata berbobot (bobot = luas) dari titik berat tiap bagian, atau cukup baca simetrinya.", "analogi": "Titik berat adalah titik tempat benda bisa <b>diseimbangkan</b> di ujung jari. Bila huruf H digunting dari karton lalu diletakkan di ujung pensil, ia akan seimbang tepat di pusat palang H-nya.", "alur": [["Bagi huruf H menjadi 3 persegi panjang", "Titik berat tiap persegi panjang ada di titik tengahnya. <b>Bagian</b> <b>Ukuran</b> <b>Luas</b> <b>Titik tengah</b> I (kiri) 2 × 6 cm 12 cm² (1 ; 3) II (tengah) 4 × 2 cm 8 cm² (2 + 2 ; 3) = (4 ; 3) III (kanan) 2 × 6 cm 12 cm² (6 + 1 ; 3) = (7 ; 3) <i>Huruf H dibagi menjadi tiga persegi panjang.</i>"], ["Hitung koordinatnya", "x0 = (12×1 + 8×4 + 12×7) / 32 = (12 + 32 + 84) / 32 = 128/32 = <b>4 cm</b> y0 = (12×3 + 8×3 + 12×3) / 32 = 96/32 = <b>3 cm</b>"], ["Periksa dengan simetri", "Huruf H simetris kiri-kanan terhadap garis x = 4 cm, jadi x0 = 4. Huruf H juga simetris atas-bawah terhadap garis y = 3 cm, jadi y0 = 3. Titik berat benda simetris selalu ada pada sumbu simetrinya, sehingga hitungan di atas cukup dipakai sebagai pemeriksaan."]], "cek": "", "pintas": "<b>Simetri dulu, hitung belakangan.</b> Cari sumbu simetri, titik berat pasti berada di sana. Hitungan panjang hanya dipakai bila bentuknya tidak simetris, misalnya huruf L pada soal latihan.", "jebakan": "<b>Menganggap titik berat = titik tengah kotak pembatas.</b> Kebetulan benar untuk H, tetapi salah untuk L atau T. <b>Lupa bobot (luas).</b> Rata-rata sederhana (1 + 4 + 7)/3 = 4 kebetulan benar di H karena simetri, tetapi gagal pada bentuk tak simetris. <b>Menukar atau menyalin sumbu.</b> Pilihan A (3 ; 4) adalah (y ; x) yang tertukar, sedangkan pilihan E (4 ; 4) memakai setengah lebar (4 cm) untuk sumbu y padahal tinggi huruf 6 cm, sehingga y = 3.", "ruang": "<b>Pertanyaan pemantik</b> “Kalau bagian tengah H dibuat lebih panjang, ke mana titik berat bergeser?” (tetap di tengah karena simetri) <b>Aktivitas / demo kelas</b> <b>Menemukan titik berat dengan benang bandul:</b> gunting huruf H dan L dari karton, lubangi dua tempat berbeda, gantung dengan jarum dan benang bandul. Perpotongan dua garis bandul adalah titik berat. Perhatikan bahwa pada L titik berat jatuh di luar bahan."}, "14": {"inti": "Momen inersia I = Σ m·r², dengan r = jarak tiap bola ke sumbu putar (bukan jarak antar bola).", "analogi": "Penari es: saat lengan <b>direntangkan</b>, ia sulit diputar (I besar); saat lengan <b>dirapatkan</b>, ia mudah berputar (I kecil). Massa yang jauh dari sumbu “terasa lebih berat” karena jaraknya dikuadratkan.", "alur": [["Tentukan jarak tiap bola ke sumbu P", "Tongkat tak bermassa tidak menyumbang momen inersia; bola dianggap partikel. Bola A (2 kg): sumbu P berjarak 1 m di kanan A, jadi rA = 1 m. Bola B (1 kg): jarak A ke B 4 m, jadi rB = 4 − 1 = 3 m."], ["Hitung", "I = mA rA² + mB rB² = 2 × 1² + 1 × 3² = 2 + 9 = <b>11 kg·m²</b> <i>Bola B lebih ringan tetapi jauh dari sumbu, sumbangannya 4,5 kali lebih besar.</i>"]], "cek": "", "pintas": "Gambar sumbu P sebagai <b>garis putus-putus</b>, lalu ukur jarak mendatar tiap massa ke garis itu. Jangan pernah memakai jarak antar-bola.", "jebakan": "<b>Lupa dikuadratkan:</b> 2×1 + 1×3 = 5 kg·m², yaitu pilihan A. <b>Hanya menghitung bola B:</b> 1 × 3² = 9 kg·m², yaitu pilihan C. <b>Memakai jarak 4 m</b> (jarak A ke B) untuk bola B: 2×1² + 1×4² = 18 kg·m², tidak ada di pilihan.", "ruang": "<b>Pertanyaan pemantik</b> “Di mana sumbu yang membuat sistem paling mudah diputar?” (di pusat massa, I minimum) <b>Aktivitas / demo kelas</b> Ikat dua beban pada ujung sapu atau tongkat panjang, lalu putar tongkat itu pada sumbu yang berbeda-beda (di tengah, di dekat satu beban). Siswa merasakan langsung perbedaan “berat” putarannya."}, "23": {"inti": "Tiga langkah: (1) hubungkan sudut θ dengan posisi pusat yoyo, (2) cari kecepatan pusat dari kecepatan benang, (3) turunkan dan samakan.", "analogi": "Pada roda sepeda yang menggelinding, titik yang menyentuh jalan <b>diam sesaat</b>. Seluruh roda sesaat berputar mengelilingi titik itu, sehingga puncak ban bergerak <b>dua kali</b> kecepatan sumbu. Aturan emasnya: kecepatan tiap titik = ω × jaraknya ke titik kontak.", "alur": [["Hubungkan sudut θ dengan posisi pusat yoyo", "Yoyo menyinggung lantai dan menyinggung batang. Pusat berjarak R dari lantai dan R dari batang, sehingga pusat yoyo berada pada <b>garis bagi</b> sudut θ. Garis bagi itu membentuk sudut θ/2 dengan lantai. Pada segitiga siku-siku engsel O, titik singgung di lantai, dan pusat yoyo: tan(θ/2) = R / x<br>→<br>x = R / tan(θ/2) = R cot(θ/2) dengan x adalah jarak mendatar dari engsel O ke pusat yoyo. <i>Geometri yoyo, batang, dan sudut θ.</i>"], ["Kecepatan pusat yoyo dari kecepatan benang", "Yoyo menggelinding tanpa slip, jadi titik kontak adalah pusat putaran sesaat. Menurut gambar, benang keluar dari bagian atas lingkaran dalam: Pusat yoyo berjarak R dari titik kontak: vpusat = ω R. Titik benang berjarak R + r dari titik kontak: v = ω (R + r). vpusat = v · R / (R + r)"], ["Hubungkan kecepatan dengan perubahan sudut", "Kecepatan pusat yoyo adalah laju perubahan x. Turunkan x = R cot(θ/2), dengan d(cot u)/dt = −1/sin²u dan aturan rantai (u = θ/2, du/dt = ½ dθ/dt): vpusat = dx/dt = R × (−1/sin²(θ/2)) × ½ (dθ/dt) = −R / (2 sin²(θ/2)) · dθ/dt"], ["Samakan dan selesaikan", "−R / (2 sin²(θ/2)) · dθ/dt = v R / (R + r) dθ/dt = <b>−2v sin²(θ/2) / (R + r)</b> <b>Arti tanda minus:</b> saat yoyo bergerak ke kanan, sudut θ makin kecil (batang makin rebah), jadi dθ/dt negatif."]], "cek": "<b>Kasus khusus 1:</b> r → 0 (benang keluar dari poros). Kecepatan pusat = v dan rumus menjadi dθ/dt = −2v sin²(θ/2)/R, sama dengan hasil langsung dari vpusat = dx/dt. <b>Kasus khusus 2:</b> r = R (benang di puncak ban). Kecepatan pusat = v/2, sesuai aturan bahwa puncak ban bergerak dua kali kecepatan sumbu.", "pintas": "Satu kalimat penyelamat: <b>“kecepatan tiap titik = ω × jarak ke titik kontak.”</b> Dengan kalimat itu, hubungan antara v benang dan v pusat selesai dalam satu baris, tanpa menghitung momen inersia atau torsi.", "jebakan": "<b>Menganggap kecepatan pusat = v</b> (seolah benang menarik pusat). Yang benar vpusat = vR/(R + r). <b>Jarak titik benang dikira r</b> padahal terhadap titik kontak jaraknya R + r. <b>Lupa aturan rantai</b> sehingga faktor ½ dari θ/2 hilang dan angka 2 di pembilang ikut lenyap: hasilnya −v sin²(θ/2)/(R+r), yaitu pilihan A. <b>Mengabaikan tanda minus.</b> Batang makin rebah, jadi θ mengecil dan dθ/dt negatif. <b>Peta pilihan:</b> A = lupa aturan rantai, B = lupa tanda, C = menganggap vpusat = v (r hilang) dan lupa tanda, D = lupa aturan rantai dan tanda. Hanya E yang lengkap.", "ruang": "<b>Pertanyaan pemantik</b> “Bila benang keluar dari bagian <b>bawah</b> lingkaran dalam, jaraknya ke titik kontak menjadi R − r. Ke mana arah pusat bergerak dan berapa lajunya?” (searah tarikan, vpusat = vR/(R − r)) <b>Aktivitas / demo kelas</b> Gunakan gulungan selotip atau kumparan benang di meja. Tarik benangnya dari atas lalu dari bawah, dan amati bahwa gulungan selalu bergerak mengikuti tarikan dengan laju yang berbeda. <b>Tips mengajar</b> Jika waktu terbatas, bahas langkah 1 dan 2 secara konseptual lalu berikan langkah 3 sebagai latihan mandiri."}, "25": {"inti": "Gesekan yang dibutuhkan berubah selama batang diangkat. Koefisien minimum adalah nilai terbesar dari f/N = t / (1 + 2t²).", "analogi": "Bayangkan <b>tangga yang bersandar</b> atau papan pintu garasi yang diangkat pelan-pelan. Ujung bawahnya paling rawan terpeleset bukan di awal dan bukan di akhir, melainkan di sudut tertentu di tengah-tengah.", "alur": [["Besar gaya tarik F (Στ = 0 terhadap ujung bawah)", "Lengan berat = (L/2) cos θ. Lengan F = L karena F tegak lurus batang. F·L = m g (L/2) cos θ<br>→<br>F = ½ m g cos θ"], ["Uraikan F", "F tegak lurus batang, sedangkan batang miring θ dari lantai, sehingga F miring θ dari arah vertikal. Komponen tegaknya F cos θ (ke atas) dan komponen mendatarnya F sin θ."], ["Gaya normal N dan gaya gesek f (ΣF = 0)", "N + F cos θ = m g<br>→<br>N = m g − ½ m g cos²θ = ½ m g (2 − cos²θ) f = F sin θ = ½ m g sin θ cos θ"], ["Syarat tidak slip: f ≤ μN", "μ ≥ f/N = sin θ cos θ / (2 − cos²θ) Bagi pembilang dan penyebut dengan cos²θ, misalkan t = tan θ. Karena 2/cos²θ = 2(1 + t²): f/N = t / (1 + 2t²)"], ["Cari nilai terbesarnya (AM–GM)", "Pakai ketidaksamaan rata-rata aritmetika ≥ rata-rata geometri pada dua suku 1 dan 2t²: 1 + 2t² ≥ 2√(1 · 2t²) = 2√2 · t<br>→<br>t/(1 + 2t²) ≤ 1/(2√2) Tanda sama dengan terjadi bila 1 = 2t², yaitu tan θ = 1/√2 (θ ≈ 35,3°). Jadi: μmin = 1/(2√2) = √2/4 = (1/4)√2 ≈ <b>0,35</b>"], ["Lihat nilainya pada beberapa sudut", "<b>θ</b> <b>10°</b> <b>20°</b> <b>35,3°</b> <b>45°</b> <b>60°</b> <b>80°</b> f/N 0,17 0,29 <b>0,354</b> 0,33 0,25 0,09 <i>Kurva f/N terhadap θ: puncaknya sekitar 35°.</i>"]], "cek": "", "pintas": "Fungsi berbentuk <b>t/(1 + 2t²)</b> hampir selalu minta nilai maksimum. Dua alat yang berlaku: AM–GM (tanpa kalkulus) atau turunan sama dengan nol, yaitu (1 + 2t²) − 4t² = 0 sehingga t² = ½, hasil yang sama.", "jebakan": "<b>Menganggap F vertikal atau horizontal.</b> Soal menyebut F “selalu tegak lurus batang”. <b>Menganggap N = mg.</b> Di sini N = mg − F cos θ karena F ikut menyangga sebagian berat batang. <b>Mengira gesekan terbesar di θ = 90° atau 0°.</b> Sebenarnya di sekitar 35°, di tengah-tengah. <b>Memakai gesekan rata-rata.</b> Yang diminta adalah nilai terbesar yang masih harus ditahan.", "ruang": "<b>Pertanyaan pemantik</b> “Di sudut berapa batang paling rawan tergelincir? Mengapa bukan di awal atau di akhir?” (di awal F tegak lurus lantai sehingga tidak punya komponen mendatar yang harus ditahan gesekan; di akhir F = 0 karena berat batang segaris dengan poros) <b>Aktivitas / demo kelas</b> <b>Tabel dulu, rumus kemudian:</b> minta siswa mengisi f/N untuk θ = 10°, 20°, …, 80° dengan kalkulator atau spreadsheet. Mereka menemukan puncaknya sendiri sebelum AM–GM diperkenalkan. Percobaan: tarik penggaris panjang di atas meja kasar secara tegak lurus penggaris, ganti alas dengan amplas dan kertas licin, lalu amati kapan ujung bawah mulai tergelincir. <b>Tips mengajar</b> Hubungkan dengan dunia teknik: perancang selalu mencari beban <b>terburuk</b> yang harus ditahan, bukan beban rata-rata."}};
