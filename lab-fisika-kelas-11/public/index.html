r:p=>f(p[2]*p[1]/p[0])+' m/s',
d:p=>{let[a,b,v]=p,k=Math.min(16,130/Math.max(a,b)),vb=v*b/a,kv=100/Math.max(v,vb);return Ci(300,170,b*k,'#2f4f8f')+Ci(300,170,a*k,'#e8833a')+Ci(300,170,4,'#fff')+L(300,170,300+a*k,170,'#fff',2)+T(300+a*k/2,160,'RA='+a,'#fff',13)+L(300,170,300-b*k,170,'#fff',2)+T(300-b*k/2,160,'RB='+b,'#fff',13)+L(300+a*k,170,300+a*k,170-v*kv,'#ffd166',5)+T(300+a*k+42,170-v*kv,'vA = '+v,'#ffd166')+L(300-b*k,170,300-b*k,170-vb*kv,'#7bd88f',5)+T(300-b*k-46,170-vb*kv,'vB = '+f(vb),'#7bd88f')}},
{n:6,g:'Gerak parabola',t:'Cari waktu peluru mencapai titik tertinggi.',q:'Sebuah peluru ditembakkan dengan kecepatan 20 m/s. Jika sudut elevasinya 60° dan g = 10 m/s², peluru akan mencapai titik tertinggi setelah ....',o:['1 s','2 s','√3 s','2√3 s','3√3 s'],a:2,
p:[['Kecepatan awal v₀',20,10,40,1,'m/s'],['Sudut elevasi α',60,15,80,5,'°']],
s:p=>{let vy=p[0]*S(p[1]*R),t=vy/10;return[`Uraikan kecepatan awal: v₀y = v₀ sin α = ${p[0]} × sin ${p[1]}° = ${f(vy)} m/s`,`Di titik tertinggi peluru berhenti sesaat arah vertikal: vy = 0, jadi 0 = v₀y − g·t`,`t = v₀y / g = ${f(vy)} / 10 = ${f(t)} s`+(p[0]==20&&p[1]==60?' (= √3 s)':'')]},
r:p=>f(p[0]*S(p[1]*R)/10)+' s',
d:p=>{let[v,a]=p,vy=v*S(a*R),vx=v*C(a*R),tp=vy/10,H=vy*vy/20,k=Math.min(500/(vx*2*tp),230/H),pt=[];for(let j=0;j<=30;j++){let t=2*tp*j/30;pt.push((50+vx*t*k)+','+(290-(vy*t-5*t*t)*k))}return L(50,290,560,290,'#888')+`<polyline points="${pt.join(' ')}" fill=none stroke=#5cc8ff stroke-width=3 stroke-dasharray="6 5" />`+L(50,290,50+vx*3,290-vy*3,'#ff6b6b',4)+T(100,270,a+'°','#ff6b6b')+Ci(50+vx*tp*k,290-H*k,9,'#ffb454')+T(50+vx*tp*k,290-H*k-16,'puncak: t = '+f(tp)+' s, H = '+f(H)+' m','#ffb454')}},
{n:8,g:'Hukum Newton',t:'Cari kecepatan maksimum mobil di tikungan.',q:'Mobil melaju pada sebuah tikungan jalan raya di posisi M. Koefisien gesekan statik antara roda dan jalan 0,5. Agar mobil tidak keluar jalur, kecepatan maksimum yang diperbolehkan adalah .... (g = 10 m/s²)',o:['10√2 m/s','7√2 m/s','5√2 m/s','4√2 m/s','2√2 m/s'],a:0,
p:[['Koefisien gesek μ',.5,.2,1,.1,''],['Jari-jari tikungan r',40,10,60,5,'m'],['Kecepatan mobil v',14,5,25,1,'m/s']],
s:p=>{let vm=Math.sqrt(p[0]*10*p[1]);return[`Di jalan datar, gaya sentripetal berasal dari gesekan statis: m v²/r ≤ μ m g. Massa mobil dicoret.`,`v maks = √(μ g r) = √(${p[0]} × 10 × ${p[1]}) = √${f(p[0]*10*p[1])}`,`v maks = ${f(vm)} m/s. Untuk μ = 0,5 dan r = 40 m: √200 = 10√2 m/s. Geser v untuk melihat mobil tergelincir.`]},
r:p=>f(Math.sqrt(p[0]*10*p[1]))+' m/s',
d:p=>{let[u,r,v]=p,vm=Math.sqrt(u*10*r),q=r*3.4,ok=v<=vm;return `<circle cx=300 cy=330 r=${q} fill=none stroke=#4a5570 stroke-width=36 /><circle cx=300 cy=330 r=${q} fill=none stroke=#cfd6e6 stroke-width=2 stroke-dasharray="10 8" /><rect x=280 y=${330-q-14} width=40 height=28 rx=8 fill=${ok?'#7bd88f':'#ff6b6b'} />`+(ok?L(300,330-q+22,300,330-q+66,'#ffd166',4)+T(300,330-q+86,'gesekan ke pusat','#ffd166',13):'')+T(300,28,ok?'AMAN ✔':'TERGELINCIR ✘','#'+(ok?'7bd88f':'ff6b6b'),22)+T(300,52,'v = '+v+' m/s · v maks = '+f(vm)+' m/s')}},
{n:14,g:'Rotasi',t:'Cari momen inersia sistem terhadap sumbu P.',q:'Dua bola dihubungkan oleh tongkat penyambung tak bermassa sepanjang 4 m (A = 2 kg, B = 1 kg). Momen inersia sistem jika diputar terhadap sumbu P yang berjarak 1 m di kanan bola A adalah ....',o:['5 kg·m²','7 kg·m²','9 kg·m²','11 kg·m²','15 kg·m²'],a:3,

{n:16,g:'Momentum & impuls',t:'Cari tinggi pantulan kedua bola.',q:'Sebuah bola bermassa 100 gram dijatuhkan dari ketinggian 8 m tanpa kecepatan awal. Setelah menyentuh lantai, bola memantul sampai ketinggian 4 m. Tinggi pantulan kedua adalah ....',o:['1,6 m','2,0 m','2,4 m','2,6 m','3,0 m'],a:1,

{n:17,g:'Momentum & impuls',t:'Cari besar impuls pada bola.',q:'Bola bermassa 20 gram dilempar dengan kecepatan v₁ = 4 m/s ke kiri. Setelah membentur tembok, bola memantul dengan kecepatan v₂ = 2 m/s ke kanan. Besar impuls yang dihasilkan adalah ....',o:['0,12 N·s','0,06 N·s','0,04 N·s','0,24 N·s','0,08 N·s'],a:0,

];

const GURU={"2": {"inti": "Pecah tiga langkah jalan kaki menjadi “ke timur” dan “ke utara”, jumlahkan tiap arah, lalu gabungkan dengan Pythagoras.", "analogi": "Bayangkan siswa Anda berjalan di lapangan sekolah: 100 langkah ke timur, 40 langkah ke utara, lalu serong. Pedometer di HP mencatat <b>jarak</b> = 240 m (total langkah). Tetapi kalau ada burung terbang lurus dari titik awal ke titik akhir, jarak terbangnya itulah <b>perpindahan</b>, yaitu 200 m. Burung selalu lebih hemat daripada pejalan kaki.", "alur": [["Uraikan vektor ketiga (100 m)", "Garis ketiga membentuk 37° terhadap <b>utara</b>, sama artinya dengan 53° terhadap timur (37° + 53° = 90°). Aturan menguraikan yang mudah diingat: komponen pada sumbu yang <b>menempel</b> pada sudut = panjang × cos; komponen pada sumbu yang <b>berhadapan</b> dengan sudut = panjang × sin. timur<br>= 100 × sin 37° = 100 × 0,6 = 60 m utara<br>= 100 × cos 37° = 100 × 0,8 = 80 m Dari mana cos 37° = 0,8? Dari sin²37° + cos²37° = 1, sehingga cos 37° = √(1 − 0,36) = 0,8. (Nilai cos 53° = 0,6 pada soal sama dengan sin 37°, sebab sudut yang saling berpenyiku nilai sin dan cos-nya tertukar.)"], ["Jumlahkan komponen sejenis", "Rx = 100 + 0 + 60 = 160 m Ry = 0 + 40 + 80 = 120 m <i>Diagram penjumlahan: tiga vektor disusun ujung ke pangkal, hasilnya R = 200 m.</i>"], ["Gabungkan dengan Pythagoras", "R = √(160² + 120²) = √(25.600 + 14.400) = √40.000 = <b>200 m</b>"]], "cek": "", "pintas": "Perhatikan rasio komponen: 160 : 120 = <b>4 : 3</b>. Segitiga dengan sisi tegak 3 : 4 selalu bersisi miring 5, jadi R = 5 × 40 = 200 m. Biasakan siswa mengenali tripel Pythagoras (3-4-5, 5-12-13, 8-15-17) sebelum mengetik kalkulator.", "jebakan": "<b>Jarak ≠ perpindahan.</b> Menjumlahkan panjang langkah (100 + 40 + 100) menghasilkan 240 m, yaitu pilihan B yang sengaja dipasang sebagai jebakan. <b>Sin dan cos tertukar.</b> Jika kedua komponen tertukar (80 m dan 60 m) hasilnya 205,9 m; jika hanya komponen tegak yang salah (60 m) hasilnya 188,7 m. Keduanya tidak ada di pilihan, dan itu alarm bagi siswa untuk mengecek ulang. <b>Sudut diukur dari mana?</b> Kalimat “37° ke arah timur” memang ambigu. Konteks soal (diberi cos 53° = 0,6) menunjukkan sudutnya 37° dari utara menuju timur. Latih siswa bertanya: “sudut ini diukur dari sumbu yang mana?”", "ruang": "<b>Pertanyaan pemantik</b> “Kalau jalan 3 langkah ke timur lalu 4 langkah ke utara, berapa langkah jalan pintas lurusnya?” (5) “Mengapa total langkah (240) tidak sama dengan perpindahan (200)?” <b>Aktivitas / demo kelas</b> Gunakan lantai berpetak atau ubin: dua siswa berjalan mengikuti rute, satu siswa berperan sebagai “burung” yang berjalan lurus. Hitung ubinnya bersama-sama. <b>Tips mengajar</b> Tutup dengan satu kalimat yang bisa dihafal: “Vektor tidak bisa dijumlah langsung. <b>Pecah, jumlah, gabung.</b>”"}, "4": {"inti": "Dua bola dilempar berselisih 2 s: tulis tinggi keduanya dengan satu “jam acuan” (waktu bola A), lalu samakan.", "analogi": "Dua mobil berangkat dari terminal yang sama, tetapi mobil B berangkat 2 jam setelah mobil A. Mereka “bertemu” bila posisinya sama pada <b>jam yang sama</b>. Bedanya, lintasan bola naik-turun: saat berpapasan, satu bola sedang turun dan yang lain sedang naik, persis dua orang yang berpapasan di tangga.", "alur": [["Satu jam acuan untuk kedua bola", "Ambil t = waktu sejak bola A dilempar. Bola B baru dilempar 2 s kemudian, sehingga waktu geraknya (t − 2). Dengan ½g = 5: yA = 20t − 5t² yB = 20(t − 2) − 5(t − 2)²"], ["Syarat bertemu: y<b>**A</b>", "= y<b>**B</b> 20t − 5t² = 20t − 40 − 5(t² − 4t + 4) 20t − 5t² = 40t − 5t² − 60 Suku −5t² ada di kedua ruas sehingga saling meniadakan: 20t = 60, jadi <b>t = 3 s</b>."], ["Hitung tinggi saat bertemu", "y = 20(3) − 5(3)² = 60 − 45 = <b>15 m</b> Cek dengan bola B (waktu geraknya 3 − 2 = 1 s): yB = 20(1) − 5(1)² = 15 m. Sama, jadi benar. Saat itu vA = 20 − 10×3 = −10 m/s (sedang turun) dan vB = 20 − 10×1 = +10 m/s (sedang naik). <i>Grafik y–t: dua parabola yang sama bentuk, B digeser 2 s. Titik potongnya adalah pertemuan.</i>"]], "cek": "", "pintas": "<b>Jalan pintas simetri.</b> Saat berpapasan, tinggi kedua bola sama, sehingga lajunya sama (kekekalan energi) tetapi arahnya berlawanan: vA = −vB. 20 − 10t = −[20 − 10(t − 2)]<br>→<br>t = 3 s Rumus umum untuk dua bola dengan kecepatan awal sama: <b>t = v</b><b>0</b><b>/g + Δt/2</b> = 2 + 1 = 3 s.", "jebakan": "<b>Menjawab 20 m</b> karena melihat “tinggi maksimum” (itu kunci sumber yang keliru). <b>Memakai t yang sama untuk A dan B</b>, lupa bahwa B baru bergerak selama (t − 2). <b>Mengira mereka bertemu saat A di puncak.</b> Pada t = 2 s bola B masih di tanah.", "ruang": "<b>Pertanyaan pemantik</b> “Pada t = 2 s, di mana bola A dan di mana bola B? Mungkinkah mereka bertemu di 20 m?” “Mengapa suku t² saling meniadakan?” (karena kedua parabola sama bentuk, jadi persamaannya menjadi linear dan hanya ada satu titik potong) <b>Aktivitas / demo kelas</b> Gambar grafik y–t di papan: satu parabola, lalu salin dan geser 2 s ke kanan. Titik potongnya langsung terlihat dan siswa melihat bahwa pertemuan terjadi di sisi turun A dan sisi naik B."}, "6": {"inti": "Yang ditanya hanya waktu ke titik tertinggi, jadi cukup pakai sumbu vertikal: kecepatan vertikal menjadi nol.", "analogi": "Bayangkan lampu menyorot bola yang terbang. <b>Bayangan di lantai</b> bergerak dengan laju tetap (GLB), sedangkan <b>bayangan di dinding</b> naik lalu turun seperti bola yang dilempar lurus ke atas. Dua bayangan itu tidak saling mengganggu. Itulah inti gerak parabola: dua gerak yang berdiri sendiri-sendiri.", "alur": [["Uraikan kecepatan awal", "v0y = v0 sin α = 20 × sin 60° = 20 × ½√3 = 10√3 m/s v0x = v0 cos α = 20 × ½ = 10 m/s"], ["Syarat titik tertinggi: v<b>**y</b>", "= 0<b> vy = v0y − g·t<br>→<br>0 = 10√3 − 10t<br>→<br></b>t = √3 s ≈ 1,73 s** Rumus umumnya t = v0 sin α / g. Tinggi maksimum: (v0 sin α)²/2g = 300/20 = 15 m, dan waktu naik 1,73 s masuk akal untuk bola yang naik 15 m dengan kecepatan awal vertikal 17,3 m/s."], ["Gambaran lengkap lintasan", "<i>Lintasan peluru: naik √3 s, total di udara 2√3 s, jangkauan sekitar 34,6 m.</i>"]], "cek": "", "pintas": "Hafalkan nilai istimewa: sin 30° = ½, sin 45° = ½√2, sin 60° = ½√3. Lalu <b>t</b><b>puncak</b><b> = v</b><b>0</b><b> sin α / g</b> langsung dipakai tanpa menurunkan lagi.", "jebakan": "<b>Pilihan A (1 s):</b> siswa memakai cos 60° = 0,5 sehingga v0y = 10 m/s dan t = 1 s. <b>Pilihan B (2 s):</b> siswa lupa menguraikan kecepatan dan memakai t = v0/g = 20/10. <b>Pilihan D (2√3 s):</b> itu waktu <b>total</b> sampai peluru mendarat (naik + turun), bukan waktu ke puncak. <b>“Di puncak peluru berhenti.”</b> Keliru: hanya vy = 0. Kecepatan mendatar tetap 10 m/s, sehingga laju di puncak = 10 m/s.", "ruang": "<b>Pertanyaan pemantik</b> “Di titik tertinggi, berapa kelajuan peluru?” (10 m/s, bukan nol) “Sudut 30° dan 60° sama-sama memberi jangkauan yang sama. Mengapa?” (R sebanding dengan sin 2α, dan sin 60° = sin 120°) <b>Aktivitas / demo kelas</b> <b>Demo koin:</b> sentil satu koin mendatar dari tepi meja dan jatuhkan koin lain bersamaan. Keduanya menyentuh lantai pada saat yang sama, bukti bahwa gerak tegak tidak terpengaruh gerak mendatar."}, "5": {"inti": "Dua roda sepusat berputar bersama, jadi ω-nya sama. Makin ke tepi, makin cepat.", "analogi": "Barisan murid bergandengan tangan berputar mengelilingi tiang bendera. Murid yang paling ujung harus <b>berlari paling kencang</b>, padahal semuanya menyelesaikan satu putaran pada saat yang sama. Itulah roda sepusat: ω sama, tetapi laju linear makin besar ke arah tepi.", "alur": [["Kenali jenis hubungan roda", "Pada gambar, kedua lingkaran memiliki satu titik pusat yang sama (<b>sepusat</b>), jadi ωA = ωB."], ["Tulis perbandingan", "vA/RA = vB/RB vB = vA × RB/RA = 4 × 8/5 = 32/5 = <b>6,4 m/s</b> Jari-jari boleh tetap dalam cm karena yang dipakai adalah perbandingannya."], ["Cek lewat ω", "ωA = vA/RA = 4/0,05 = 80 rad/s dan ωB = 6,4/0,08 = 80 rad/s. Kedua ω sama, jadi hitungan konsisten. Tepi roda yang jari-jarinya lebih besar memang harus bergerak lebih cepat (6,4 m/s &gt; 4 m/s)."]], "cek": "", "pintas": "Mnemonik untuk siswa: <b>“Satu poros, sama ω. Satu sabuk, sama v.”</b> Sepusat: v sebanding dengan R. Sabuk atau bersinggungan: ω berbanding terbalik dengan R.", "jebakan": "<b>Memakai v sama</b> (menjawab 4 m/s) karena merasa “rodanya terhubung”. Itu berlaku untuk sabuk, bukan roda sepusat. <b>Perbandingan terbalik:</b> vB = 4 × 5/8 = 2,5 m/s. Hasil ini tidak ada di pilihan, tetapi sering muncul pada siswa yang menukar RA dan RB. <b>Salah membaca gambar</b> sehingga dua roda sepusat dianggap saling bersinggungan.", "ruang": "<b>Pertanyaan pemantik</b> “Jarum menit jam dinding: ujung dan pangkalnya sama-sama menyelesaikan satu putaran dalam 60 menit. Titik mana yang lajunya lebih besar?” <b>Aktivitas / demo kelas</b> Tempel dua stiker pada keping CD, satu dekat pusat dan satu di tepi. Putar perlahan dan minta siswa memperkirakan mana yang “selesai satu putaran” lebih dulu dan mana yang lajunya lebih besar."}, "8": {"inti": "Gesekan ban adalah “tali” yang menarik mobil ke pusat tikungan, dan kekuatan “tali” itu terbatas sebesar μ·m·g.", "analogi": "Putar sebuah bola yang diikat tali. Tali menarik bola ke pusat. Di tikungan jalan datar, “tali”-nya adalah <b>gesekan ban</b>. Jika gesekan tidak cukup kuat, “tali” putus dan mobil lepas <b>lurus</b> mengikuti arah geraknya, bukan “terlempar keluar” oleh gaya misterius.", "alur": [["Syarat tidak tergelincir", "Gaya sentripetal yang dibutuhkan tidak boleh melebihi gesekan maksimum: m v²/r ≤ μ m g<br>→<br>v ≤ √(μ g r) Massa mobil m dicoret di kedua ruas, jadi kecepatan maksimum <b>tidak bergantung pada massa</b>. Kecepatan maksimum didapat saat tanda ≤ menjadi =."], ["Substitusi angka", "Dengan μ = 0,5, g = 10 m/s², dan r = 40 m (jari-jari lintasan di posisi M menurut pembahasan sumber): vmaks = √(0,5 × 10 × 40) = √200 = √(100 × 2) = <b>10√2 m/s</b>"], ["Beri “rasa” pada angkanya", "10√2 ≈ 14,1 m/s ≈ <b>51 km/jam</b>. Angka seperti ini membantu siswa merasakan bahwa tikungan kecil di jalan kampung memang tidak boleh dilalui sekencang jalan tol."]], "cek": "", "pintas": "Ingat bentuk <b>v = √(μ g r)</b> sebagai “μgr di bawah akar”. Tiga akibat yang bisa ditebak tanpa menghitung: jalan basah (μ turun) → vmaks turun; tikungan lebih tajam (r turun) → vmaks turun; massa mobil tidak berpengaruh. Karena v ∝ √r, tikungan yang 4 kali lebih tajam hanya boleh dilalui dengan <b>setengah</b> kecepatan.", "jebakan": "<b>“Gaya sentrifugal melempar mobil keluar.”</b> Dalam kerangka tanah tidak ada gaya semacam itu. Mobil ingin lurus (inersia), dan gesekan yang membelokkannya. <b>Mengira massa memengaruhi hasil.</b> Truk dan motor memiliki vmaks sama jika μ dan r sama. <b>Lupa tanda akar</b> sehingga menjawab v² = 200 m²/s² sebagai kecepatan, atau memakai r = 30 m dari gambar tanpa membaca catatan di atas.", "ruang": "<b>Pertanyaan pemantik</b> “Mengapa rambu ‘kurangi kecepatan’ di tikungan paling penting saat hujan?” (μ turun, vmaks turun) “Mengapa penumpang terasa terdorong ke luar?” (penumpang ingin lurus, sedangkan mobil berbelok) <b>Aktivitas / demo kelas</b> <b>Koin di piringan putar:</b> letakkan dua koin di atas piringan (atau tutup toples di atas CD yang diputar pelan di pemutar piringan). Koin yang di tepi terlempar duluan, sedangkan koin dekat pusat bertahan, tanda bahwa syarat μg ≥ ω²r lebih sulit dipenuhi di r besar."}, "16": {"inti": "Tiap pantulan mengalikan tinggi dengan e² yang tetap. Dari 8 m → 4 m, maka pantulan berikutnya 4 m → 2 m.", "analogi": "Seperti tabungan yang tiap kali diambil separuhnya: 8 → 4 → 2 → 1. Faktor pengalinya tetap karena sifat bola dan lantai tidak berubah. Bola yang bagus (e besar) kehilangan sedikit; bola plastisin (e = 0) kehilangan semuanya.", "alur": [["Cari e dari pantulan pertama", "e = √(4/8) = √(1/2) = 1/√2 ≈ 0,71"], ["Terapkan pada pantulan kedua", "Bola kini jatuh dari 4 m (tinggi pantulan pertama) dan memantul sampai h2: e = √(h2/4)<br>→<br>e² = h2/4<br>→<br>h2 = e² × 4 = ½ × 4 = <b>2 m</b>"], ["Lihat polanya", "<i>Tinggi berturut-turut 8 → 4 → 2 → 1 m: deret geometri dengan rasio e².</i>"]], "cek": "", "pintas": "Setiap pantulan: <b>tinggi baru = tinggi lama × e²</b>, dan e² = h′/h dari pantulan pertama. Dengan begitu 8 → 4 → 2 → 1. Massa bola 100 gram hanyalah data pengecoh karena m dicoret dalam kekekalan energi.", "jebakan": "<b>Tinggi dikali e, bukan e².</b> Dengan e = 0,71 siswa mendapat 0,71 × 4 = 2,83 m, yang tidak ada di pilihan, sehingga ketahuan salah. <b>Menyamakan e dengan h′/h = ½.</b> Di soal ini jawabannya kebetulan tetap 2 m (4 × ½), sehingga kesalahan konsep lolos begitu saja. Pancing dengan pertanyaan: “berapa e-nya?” Jawaban yang benar 0,71, bukan 0,5. <b>Menebak “tinggal dibagi 2”</b> tanpa alasan. Cara itu gagal bila rasionya tidak sederhana, misalnya 8 → 5 → ? (jawaban 5 × 5/8 = 3,125 m). <b>Terpengaruh massa 100 g</b> sehingga mencoba menghitung energi atau gaya.", "ruang": "<b>Pertanyaan pemantik</b> “Berapa persen energi yang hilang pada setiap pantulan?” (e² = 50%, jadi separuh) “Bila e = 1, ke mana tinggi pantulan? Bila e = 0?” (tetap sama; tidak memantul sama sekali) <b>Aktivitas / demo kelas</b> <b>Ukur e sendiri:</b> jatuhkan bola pingpong dari 1 m di samping penggaris tegak, rekam dengan kamera HP (mode slow-mo), dan baca tinggi pantulan pertama dan kedua. Hitung e dari dua pantulan dan lihat apakah hasilnya konsisten."}, "17": {"inti": "Bola berbalik arah: perubahan kecepatan dari −4 menjadi +2 adalah 6 m/s, bukan 2 m/s.", "analogi": "Saat memukul bola kasti, pemukul mengerjakan <b>dua pekerjaan</b>: pertama menghentikan bola yang datang, kedua melontarkannya kembali. Impuls adalah jumlah kedua pekerjaan itu. Untuk bola ini: menghentikan (0,02 × 4 = 0,08) ditambah melontarkan kembali (0,02 × 2 = 0,04) = <b>0,12 N·s</b>.", "alur": [["Tetapkan arah positif dan satuan", "Ambil arah ke kanan positif. Massa 20 g = 0,02 kg. Bola datang ke kiri sehingga v1 = −4 m/s, dan memantul ke kanan sehingga v2 = +2 m/s."], ["Hitung impuls", "I = m (v2 − v1) = 0,02 × (2 − (−4)) = 0,02 × 6 = <b>0,12 N·s</b> Tanda positif berarti impuls berarah ke kanan, yaitu dari tembok ke bola, sebab dinding mendorong bola ke kanan."]], "cek": "", "pintas": "Kalau bola <b>berbalik arah</b>: I = m (│v1│ + │v2│). Kalau arahnya <b>sama</b> (hanya melambat): I = m (│v1│ − │v2│). Pertanyaan penentunya: “apakah bola berbalik?”", "jebakan": "<b>Mengurangkan besar kecepatan</b> (4 − 2 = 2) sehingga mendapat 0,04 N·s. Itu kunci sumber yang keliru. <b>Gram tidak diubah ke kilogram:</b> 20 × 6 = 120, jauh dari semua pilihan. <b>Menyamakan impuls dengan gaya.</b> Satuan impuls N·s, bukan N. Gaya rata-rata baru didapat setelah dibagi waktu sentuh.", "ruang": "<b>Pertanyaan pemantik</b> “Berapa langkah dari −4 ke +2 di garis bilangan?” (6, tulis di papan sebelum menghitung apa pun) “Mana yang lebih besar impulsnya: bola yang memantul atau bola plastisin yang menempel di tembok?” (yang memantul, karena arahnya berbalik) <b>Aktivitas / demo kelas</b> Lempar bola tenis dan bola plastisin (massa sama, kecepatan sama) ke papan tulis kecil yang digantung. Papan lebih bergoyang saat dikenai bola yang memantul, bukti impulsnya lebih besar. <b>Tips mengajar</b> <b>Perluasan:</b> bila waktu sentuh 0,01 s, gaya rata-rata = I/Δt = 0,12/0,01 = 12 N."}, "14": {"inti": "Momen inersia I = Σ m·r², dengan r = jarak tiap bola ke sumbu putar (bukan jarak antar bola).", "analogi": "Penari es: saat lengan <b>direntangkan</b>, ia sulit diputar (I besar); saat lengan <b>dirapatkan</b>, ia mudah berputar (I kecil). Massa yang jauh dari sumbu “terasa lebih berat” karena jaraknya dikuadratkan.", "alur": [["Tentukan jarak tiap bola ke sumbu P", "Tongkat tak bermassa tidak menyumbang momen inersia; bola dianggap partikel. Bola A (2 kg): sumbu P berjarak 1 m di kanan A, jadi rA = 1 m. Bola B (1 kg): jarak A ke B 4 m, jadi rB = 4 − 1 = 3 m."], ["Hitung", "I = mA rA² + mB rB² = 2 × 1² + 1 × 3² = 2 + 9 = <b>11 kg·m²</b> <i>Bola B lebih ringan tetapi jauh dari sumbu, sumbangannya 4,5 kali lebih besar.</i>"]], "cek": "", "pintas": "Gambar sumbu P sebagai <b>garis putus-putus</b>, lalu ukur jarak mendatar tiap massa ke garis itu. Jangan pernah memakai jarak antar-bola.", "jebakan": "<b>Lupa dikuadratkan:</b> 2×1 + 1×3 = 5 kg·m², yaitu pilihan A. <b>Hanya menghitung bola B:</b> 1 × 3² = 9 kg·m², yaitu pilihan C. <b>Memakai jarak 4 m</b> (jarak A ke B) untuk bola B: 2×1² + 1×4² = 18 kg·m², tidak ada di pilihan.", "ruang": "<b>Pertanyaan pemantik</b> “Di mana sumbu yang membuat sistem paling mudah diputar?” (di pusat massa, I minimum) <b>Aktivitas / demo kelas</b> Ikat dua beban pada ujung sapu atau tongkat panjang, lalu putar tongkat itu pada sumbu yang berbeda-beda (di tengah, di dekat satu beban). Siswa merasakan langsung perbedaan “berat” putarannya."}};
const an=q=>{let G=bb==0&&GURU[q.n];return G&&G.analogi?`<div class=goal><small>Analogi · buka kelas dengan cerita ini</small>${G.analogi}</div>`:''};
const BAB=[{n:'Bab 1',t:'Vektor, Kinematika, dan Dinamika Gerak Partikel',Q:BAB1}];
let Q=[],U=0,i=0,ph=0,sh=0,P=[],A=[],pl=0,tm=0,t0=0,bb=-1,AS=[];
function pick(k){bb=k;Q=BAB[k].Q;A=AS[k]=AS[k]||[];go(0,0)}
function login(){let n=$('nm').value.trim();if(!n)return;U={n,t:n.toLowerCase()=='ferdi'};AS.length=0;bb=-1;Q=[];A=[];render()}
function go(n,p){i=n;ph=p;sh=0;pl=0;tm=0;if(Q[i])P=Q[i].p.map(x=>x[1]);render()}
const hd=q=>`<span class=bd>${q.g}</span><h2>Soal ${q.n}</h2><p class=q>${q.q}</p>`;
const soal=q=>`<div class=card>${hd(q)}<div class=ops>${q.o.map((o,k)=>`<div class=op><b>${AB[k]}</b>${o}</div>`).join('')}</div>${an(q)}<div class=nv>${i?`<button class=gh onclick="go(i-1,1)">◀ Soal sebelumnya</button>`:'<span></span>'}<button onclick="go(i,1)">Buka wahana pembahasan ▶</button></div></div>`;
const lab=q=>`<div class=lab><div class=stg><div id=sv></div><div class=hud id=hud></div><div class=ak id=ak></div></div><aside class=card><span class=ey>Stasiun ${i+1} dari ${Q.length}</span><h2>Soal ${q.n} · ${q.g}</h2><div class=goal><small>Tujuan</small>${q.t}</div><span class=ey>Atur nilai</span>${q.p.map((x,k)=>`<label>${x[0]}: <b id=v${k}></b><input type=range min=${x[2]} max=${x[3]} step=${x[4]} value=${x[1]} oninput="P[${k}]=+this.value;upd()"></label>`).join('')}<span class=ey>Prosedur</span><ol id=stp></ol><div id=ex></div><div class=nv><button class=gh onclick="go(i,0)">◀ Soal</button><button class=gh onclick="go(i,1)">↺ Atur ulang</button><button class=gh id=pb onclick="play()">▶ Mainkan</button><button id=nx></button></div></aside></div>`;
const stud=q=>{let a=A[i],d=a!=null;return `<div class=card>${hd(q)}<div class=ops>${q.o.map((o,k)=>`<button class="op ${d?(k==q.a?'ok':k==a?'bad':''):''}" ${d?'disabled':''} onclick="A[i]=${k};render()"><b>${AB[k]}</b>${o}</button>`).join('')}</div>${d?`<div class=goal><small>${a==q.a?'✔ Benar':'✘ Belum tepat'}: pembahasan</small><ol>${q.s(q.p.map(x=>x[1])).map(s=>`<li>${s}</li>`).join('')}</ol></div>`:''}<div class=nv>${i?`<button class=gh onclick="go(i-1,0)">◀ Kembali</button>`:'<span></span>'}<button onclick="go(i+1,0)">${i<Q.length-1?'Berikutnya ▶':'Selesai'}</button></div></div>`};
function upd(){let q=Q[i],G=bb==0&&GURU[q.n],st=G?G.alur.map(a=>'<b>'+a[0]+'</b><br>'+a[1]).concat(['<b>Coba ubah nilainya</b><br>Geser slider: hasil wahana sekarang = <b>'+q.r(P)+'</b>']):q.s(P),n=st.length;sh=Math.min(sh,n);
draw();
q.p.forEach((x,k)=>$('v'+k).textContent=f(P[k])+' '+x[5]);
$('stp').innerHTML=st.slice(0,sh).map(s=>`<li>${s}</li>`).join('')||'<li class=mu>Tekan “Langkah berikutnya” untuk memulai.</li>';
$('ex').innerHTML=G&&sh>=n?[['Inti soal','inti'],['Jalan pintas','pintas'],['Jebakan dan miskonsepsi','jebakan'],['Ruang kelas','ruang']].map(a=>G[a[1]]?'<div class=goal><small>'+a[0]+'</small>'+G[a[1]]+'</div>':'').join(''):'';
$('ak').innerHTML=`<b>Kunci jawaban · soal ${q.n}</b><br>`+(sh>=n?`<b>${AB[q.a]}. ${q.o[q.a]}</b><br><span class=mu>Hasil wahana: ${q.r(P)}</span>`:`<span class=mu>Selesaikan ${n} langkah dulu…</span>`);
let b=$('nx');b.textContent=sh>=n?(i<Q.length-1?'Soal berikutnya ▶':'Selesai ▶'):'Langkah berikutnya ▶';b.onclick=()=>sh>=n?go(i+1,0):(sh++,upd())}
function render(){const app=$('app');
if(!U){app.innerHTML=`<div class=lg><h1>⚛ Lab Fisika 11</h1><p class=mu>Vektor, kinematika, dan dinamika gerak partikel</p><input id=nm placeholder="Masukkan nama kamu" onkeydown="event.key=='Enter'&&login()"><button onclick=login()>Masuk</button></div>`;return}
let q=Q[i],sc=A.filter((a,k)=>a==Q[k].a).length,hh=`<header><b>⚛ Lab Fisika 11</b><span>${esc(U.n)} <em>${U.t?'Pengajar':'Siswa'}</em>${U.t||bb<0?'':` · Skor ${sc}/${Q.length}`} ${bb<0?'':`<button class=gh onclick="bb=-1;Q=[];A=[];render()">☰ Bab</button>`} <button class=gh onclick="U=0;render()">Keluar</button></span></header>${bb<0?'':`<nav class=nb><span class=mu>Pilih soal:</span>${Q.map((x,k)=>`<button class="gh${k==i?' on':''}${!U.t&&A[k]!=null?(A[k]==x.a?' ok':' bad'):''}" onclick="go(${k},0)">${x.n}</button>`).join('')}</nav>`}`;
if(bb<0){app.innerHTML=hh+`<h2>Pilih bab</h2><div class=bg>${BAB.map((b,k)=>`<div class=card><span class=bd>${b.n}</span><h2>${b.t}</h2><p class=mu>${b.Q.length} soal · ${[...new Set(b.Q.map(x=>x.g))].join(', ')}</p><button onclick="pick(${k})">Buka ${b.n} ▶</button></div>`).join('')}<div class="card mu"><h2>Bab berikutnya</h2><p>Segera hadir.</p></div></div>`;return}
if(!q){app.innerHTML=hh+`<div class=card><h2>Selesai 🎉</h2><p>${U.t?'Semua soal sudah dibahas.':`Skor akhir kamu ${sc} dari ${Q.length}.`}</p><button onclick="A.length=0;go(0,0)">Ulangi dari soal 1</button></div>`;return}
app.innerHTML=hh+(U.t?(ph?lab(q):soal(q)):stud(q));if(U.t&&ph)upd()}
render();
</script></body></html>
